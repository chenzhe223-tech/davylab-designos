name: DesignOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install document layout QA dependencies
        run: python3 -m pip install -r requirements-layout-qa.txt
      - run: npm run validate:rules
      - name: Install Playwright for browser acceptance
        run: npm install --no-save @playwright/test
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Test Excel document layout QA adapter
        run: python3 -m unittest discover -s tests -p 'test_document_layout_qa.py'
      - name: Test Word document layout QA adapter
        run: python3 -m unittest discover -s tests -p 'test_document_layout_word_qa.py'
      - name: Test PowerPoint document layout QA adapter
        run: python3 -m unittest discover -s tests -p 'test_document_layout_pptx_qa.py'
      - name: Test PDF rendering and layout QA adapter
        run: python3 -m unittest discover -s tests -p 'test_document_layout_pdf_qa.py'
      - name: Create PDF QA smoke fixture
        run: |
          python3 - <<'PY'
          import fitz
          doc = fitz.open()
          page = doc.new_page(width=595, height=842)
          page.insert_text((72, 72), "Procurement cost summary", fontsize=12)
          page.insert_text((72, 110), "Total investment: EUR 494,569.00", fontsize=10)
          import os
          os.makedirs("artifacts/pdf-layout", exist_ok=True)
          doc.save("artifacts-layout-qa-smoke.pdf")
          doc.close()
          PY
      - name: Render and inspect PDF smoke fixture
        run: python3 scripts/document_layout_pdf_qa.py artifacts-layout-qa-smoke.pdf --out artifacts/pdf-layout --dpi 96 --json > artifacts/pdf-layout-stdout.json
      - name: Test Render client-IP rate-limit key
        run: python3 -m unittest discover -s tests -p 'test_engine_api_rate_limit.py'
      - run: npm test
      - name: Run responsive document layout QA on fixture
        run: npm run qa:layout:browser -- tests/fixtures/document-layout-sample.html --out ./artifacts/layout-qa
      - name: Confirm browser QA catches deliberate misalignment
        shell: bash
        run: |
          set +e
          npm run qa:layout:browser -- tests/fixtures/document-layout-bad-sample.html --out ./artifacts/layout-qa
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then echo "Expected browser QA to exit 1 for the deliberate alignment mismatch; got $status"; exit 1; fi
          echo "Expected alignment regression detected."
      - name: Upload document layout QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-layout-qa
          path: artifacts/layout-qa\n            artifacts/pdf-layout\n            artifacts/pdf-layout-stdout.json\n          if-no-files-found: warn
          retention-days: 14
      - name: Run desktop and mobile end-to-end tests
        run: npx playwright test
      - run: npm run build
      - name: Install pinned real UI UX Pro Max engine
        run: npm run engine:setup
      - name: Inventory real upstream capability datasets
        run: npm run inventory:skill
      - name: Preserve auditable capability inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-capability-inventory
          path: generated/skill-capability-inventory.json
          if-no-files-found: warn
          retention-days: 30
      - name: Generate real engine smoke output
        run: node scripts/designos.mjs generate --query "SaaS dashboard for project tracking" --project "DesignOS CI Smoke" --output generated/engine-smoke.json
      - name: Validate real engine output
        run: npm run verify:engine-output -- generated/engine-smoke.json
