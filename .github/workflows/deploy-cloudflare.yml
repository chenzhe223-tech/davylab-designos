name: Deploy DesignOS to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: designos-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add repository secret CLOUDFLARE_API_TOKEN before deploying."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add repository variable CLOUDFLARE_ACCOUNT_ID before deploying."; exit 1; }
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROJECTS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          if ! printf '%s' "$PROJECTS" | grep -q '"name":"davylab-designos"'; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"davylab-designos","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          fi
      - name: Deploy static preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p site
          cp index.html site/index.html
          npx --yes wrangler@4 pages deploy site --project-name=davylab-designos --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_WORKFLOW: $GITHUB_SHA"
      - name: Verify production URL
        run: |
          set -euo pipefail
          URL="https://davylab-designos.pages.dev/"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 "$URL" -o /tmp/designos.html
          grep -q "DAVYLAB DesignOS" /tmp/designos.html
          grep -q "设计档案" /tmp/designos.html
          echo "PASS: Cloudflare Pages deployment verified: $URL"
