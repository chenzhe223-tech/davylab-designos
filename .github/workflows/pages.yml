name: Deploy DesignOS preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 "$PAGE_URL" -o /tmp/designos.html
          grep -q "DAVYLAB DesignOS" /tmp/designos.html
          grep -q "设计档案" /tmp/designos.html
          echo "PASS: deployed DesignOS page responded and content checks passed: $PAGE_URL"
