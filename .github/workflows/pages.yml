name: Deploy DesignOS preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "profiles/**"
      - "projects/**"
      - "schemas/**"
      - "scripts/**"
      - "engine.lock.json"
      - "package.json"
      - "playwright.config.mjs"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate profiles
        run: npm run validate:rules
      - name: Install Playwright for browser acceptance
        run: npm install --no-save @playwright/test
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Test preview
        run: npm test
      - name: Run desktop and mobile end-to-end tests
        run: npx playwright test
      - name: Build static site
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout test suite
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 "$PAGE_URL" -o /tmp/designos.html
          grep -q "DAVYLAB DesignOS" /tmp/designos.html
          grep -q "设计档案" /tmp/designos.html
          echo "PASS: deployed DesignOS page responded and content checks passed: $PAGE_URL"
      - name: Checkout repository for deployed browser test
        uses: actions/checkout@v4
      - name: Setup Node for deployed browser test
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright for deployed browser test
        run: npm install --no-save @playwright/test
      - name: Install Chromium for deployed browser test
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance against deployed GitHub Pages preview
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npx playwright test
