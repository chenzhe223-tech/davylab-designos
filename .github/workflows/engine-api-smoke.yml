name: DesignOS Live Engine API Smoke Test

on:
  workflow_run:
    workflows: ["Deploy DesignOS to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davylab-designos-live-engine-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render API to wake up
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error https://davylab-designos-engine.onrender.com/health; then
              echo
              exit 0
            fi
            echo "API not ready yet ($attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "Engine API did not become healthy within 3 minutes."
          exit 1

      - name: Verify strict single-origin CORS headers
        shell: bash
        run: |
          set -euo pipefail
          API='https://davylab-designos-engine.onrender.com'
          for origin in \
            'https://davylab-designos.pages.dev' \
            'https://preview-branch.davylab-designos.pages.dev'; do
            curl --fail --silent --show-error -D response-headers.txt -o /dev/null \
              -H "Origin: $origin" "$API/health"
            count=$(grep -ic '^Access-Control-Allow-Origin:' response-headers.txt || true)
            test "$count" = "1"
            actual=$(grep -i '^Access-Control-Allow-Origin:' response-headers.txt | sed 's/\r$//' | sed 's/^[^:]*:[[:space:]]*//')
            test "$actual" = "$origin"
            echo "PASS: one exact Access-Control-Allow-Origin header for $origin"
          done

          status=$(curl --silent --show-error -o untrusted-origin.json -w '%{http_code}' \
            -H 'Origin: https://untrusted.example' "$API/health")
          test "$status" = "403"
          if grep -qi '^Access-Control-Allow-Origin:' <(curl --silent --show-error -D - -o /dev/null \
            -H 'Origin: https://untrusted.example' "$API/health"); then
            echo "::error::Untrusted origin received an Access-Control-Allow-Origin header"
            exit 1
          fi
          echo 'PASS: untrusted origins are rejected without CORS permission'

      - name: Verify pinned engine readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://davylab-designos-engine.onrender.com/api/status -o status.json
          cat status.json
          node -e "const s=require('./status.json'); if(!s.ready || s.expectedSkillVersion!=='2.15.0' || s.searchScriptExists!==true) process.exit(1)"

      - name: Verify generated capability inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://davylab-designos-engine.onrender.com/api/capabilities -o capabilities.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('capabilities.json','utf8'));
          if(x.generatedFrom?.skillVersion!=='2.15.0') throw new Error('unexpected Skill version');
          if(!x.summary || x.summary.missingDomains?.length) throw new Error('capability inventory incomplete');
          console.log(JSON.stringify(x.summary,null,2));
          NODE

      - name: Verify searchable source-backed capability records
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'https://davylab-designos-engine.onrender.com/api/capabilities?domain=styles.csv&limit=10&offset=0' -o catalog.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('catalog.json','utf8'));
          const d=x.domains?.[0];
          if(x.selectedDomain!=='styles.csv' || x.domains.length!==1 || d?.id!=='styles.csv') throw new Error('capability domain filter is not applied');
          if(!Array.isArray(d.records) || d.records.length===0 || d.records.length>10) throw new Error('capability pagination failed');
          if(!d.records[0].fields || typeof d.records[0].fields!=='object') throw new Error('raw source fields are missing');
          console.log(JSON.stringify({domain:d.id,totalMatches:d.totalMatches,returnedRecords:d.returnedRecords,sourcePath:d.sourcePath},null,2));
          NODE

      - name: Verify live official Skill search
        shell: bash
        run: |
          set -euo pipefail
          http_code=000
          for attempt in 1 2 3; do
            http_code=$(curl --silent --show-error --max-time 45 -w '%{http_code}' https://davylab-designos-engine.onrender.com/api/search \
              -H 'Content-Type: application/json' \
              -d '{"query":"AI travel app for young travelers and hidden destinations","domain":"style"}' \
              -o search.json || true)
            if [ "$http_code" = "200" ]; then break; fi
            echo "Live Skill search attempt $attempt returned HTTP $http_code"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "Live Skill search HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then cat search.json; exit 1; fi
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('search.json','utf8'));
          if(!x || typeof x!=='object' || Object.keys(x).length===0) throw new Error('empty search output');
          if(x.engine?.skillVersion!=='2.15.0' || !x.result || !Array.isArray(x.result.results) || x.result.results.length===0) throw new Error('live Skill search returned no source-backed records');
          console.log(JSON.stringify({skillVersion:x.engine.skillVersion,domain:x.result.domain,count:x.result.count,firstRecord:x.result.results[0]},null,2));
          NODE

      - name: Verify live design-system generation and product-category mapping
        shell: bash
        run: |
          set -euo pipefail
          http_code=000
          for attempt in 1 2 3; do
            http_code=$(curl --silent --show-error --max-time 90 -w '%{http_code}' https://davylab-designos-engine.onrender.com/api/generate \
              -H 'Content-Type: application/json' \
              -d '{"query":"AI travel app for young travelers, hidden destinations, itinerary planning and travel memories","project":"DesignOS Live API Smoke"}' \
              -o candidate.json || true)
            if [ "$http_code" = "200" ]; then break; fi
            echo "Design-system generation attempt $attempt returned HTTP $http_code"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "Engine generation HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then cat candidate.json; exit 1; fi
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('candidate.json','utf8'));
          if(x.status!=='candidate' || x.engine?.skillVersion!=='2.15.0' || !x.profile || !x.result?.design_system) throw new Error('candidate does not match expected official-engine contract');
          const category=String(x.result.design_system.category||'');
          const productType=String(x.profile.productType||'');
          const paletteSource=String(x.result.design_system.source_identities?.color||'');
          if(!/travel|tourism/i.test(category) || !/travel|tourism/i.test(productType) || !/travel|tourism/i.test(paletteSource)) throw new Error('Travel brief did not map to a travel/tourism category and palette source: '+JSON.stringify({category,productType,paletteSource}));
          console.log(JSON.stringify({status:x.status,skillVersion:x.engine.skillVersion,category,productType,paletteSource},null,2));
          NODE

      - name: Verify multi-category product mapping
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const cases = [
            {id:'saas',query:'SaaS subscription software platform for B2B cloud business workflows',expected:/saas/i},
            {id:'ecommerce',query:'E-commerce retail online shop store for selling products with shopping cart checkout',expected:/e-commerce/i},
            {id:'ai-chatbot',query:'AI chatbot platform for machine learning automation and conversational assistant',expected:/ai\s*\/\s*chatbot platform/i},
            {id:'portfolio',query:'Personal portfolio website to showcase projects creative work and case studies',expected:/portfolio\s*\/\s*personal/i},
            {id:'analytics-dashboard',query:'Analytics dashboard for KPI metrics funnel conversion and business intelligence reporting',expected:/analytics dashboard/i},
          ];
          const endpoint='https://davylab-designos-engine.onrender.com/api/generate';
          const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          for (const sample of cases) {
            let response, body, lastError;
            for (let attempt=1; attempt<=3; attempt++) {
              try {
                response=await fetch(endpoint,{
                  method:'POST',
                  headers:{'Content-Type':'application/json'},
                  body:JSON.stringify({query:sample.query,project:'DesignOS category smoke: '+sample.id}),
                  signal:AbortSignal.timeout(90000),
                });
                if (response.status===200) {
                  body=await response.json();
                  break;
                }
                const message=await response.text();
                lastError=new Error('HTTP '+response.status+': '+message.slice(0,300));
              } catch (error) {
                lastError=error;
              }
              if (attempt<3) await pause(attempt*5000);
            }
            if (!body) throw new Error(sample.id+' generation failed: '+String(lastError));
            if (body.status!=='candidate' || body.engine?.skillVersion!=='2.15.0' || !body.result?.design_system || !body.profile) {
              throw new Error(sample.id+' returned an invalid candidate contract');
            }
            const category=String(body.result.design_system.category||'');
            const productType=String(body.profile.productType||'');
            const paletteSource=String(body.result.design_system.source_identities?.color||'');
            if (!sample.expected.test(category) || !sample.expected.test(productType) || !sample.expected.test(paletteSource)) {
              throw new Error(sample.id+' category/palette mismatch: '+JSON.stringify({category,productType,paletteSource}));
            }
            console.log(JSON.stringify({id:sample.id,category,productType,paletteSource,status:'passed'}));
          }
          NODE

      - name: Verify non-empty live React stack guidance
        shell: bash
        run: |
          set -euo pipefail
          http_code=000
          for attempt in 1 2 3; do
            http_code=$(curl --silent --show-error --max-time 45 -w '%{http_code}' https://davylab-designos-engine.onrender.com/api/search \
              -H 'Content-Type: application/json' \
              -d '{"query":"Use useReducer for complex state","domain":"style","stack":"react"}' \
              -o stack-guidance.json || true)
            if [ "$http_code" = "200" ]; then break; fi
            echo "React guidance search attempt $attempt returned HTTP $http_code"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "Stack guidance HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then cat stack-guidance.json; exit 1; fi
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('stack-guidance.json','utf8'));
          const guidance=x.result;
          if(x.kind!=='designos-engine-search' || x.engine?.skillVersion!=='2.15.0' || !guidance) throw new Error('stack-specific guidelines are missing');
          if(guidance.domain!=='stack' || guidance.stack!=='react' || !Number.isInteger(guidance.count) || guidance.count<1 || !Array.isArray(guidance.results) || guidance.results.length<1) throw new Error('React stack search returned no real guidance records: '+JSON.stringify(guidance));
          if(!guidance.results.some(row=>String(row.Status||'').toLowerCase()==='active')) throw new Error('React stack search returned no active guidance records');
          console.log(JSON.stringify({stack:guidance.stack,count:guidance.count,firstGuideline:guidance.results[0].Guideline,status:guidance.results[0].Status},null,2));
          NODE
