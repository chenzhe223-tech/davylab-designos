<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vibe Studio · By DAVYLAB</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f0e9;background:#11141b}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid #343843}small{color:#aeb7c5}.shell{max-width:1180px;margin:auto;padding:32px 20px}h1{font-size:clamp(34px,5vw,60px);letter-spacing:-.05em;margin:12px 0}p{color:#b7bec9}main{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:24px;margin-top:30px}.panel{background:#1b202a;border:1px solid #343b48;border-radius:22px;padding:22px}label{display:block;font-size:13px;margin:15px 0 8px;color:#c9ced7}textarea,select{width:100%;border:1px solid #4c5664;background:#10151e;color:#fff;border-radius:12px;padding:12px;font:inherit}textarea{min-height:118px;resize:vertical}button{background:#e6ba7b;color:#20170e;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}button.secondary{background:#333c4b;color:#f8f6f0}button:disabled{opacity:.5;cursor:not-allowed}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}canvas{width:100%;aspect-ratio:9/12;background:#080d17;border-radius:14px;display:block}.preview{max-width:360px;margin:auto}ol{padding-left:22px;color:#bbc4d2}li{padding:6px 0}strong{color:#fff}#status{min-height:22px;font-size:13px;color:#e6ba7b}@media(max-width:740px){main{grid-template-columns:1fr}header{padding:16px 20px}.shell{padding-top:18px}}</style><link rel="stylesheet" href="./premium.css"></head><body><header><b>✦ DAVYLAB <small> / Vibe Studio</small></b><nav aria-label="主导航"><a href="#create">创作首页</a><a href="#create">AI 创作台</a><a href="#scene">动画工作台</a></nav><small>P0 · 动画实验室</small></header><div class="shell"><small>CREATE THE IMPOSSIBLE</small><h1>一句话，创造一个世界。</h1><p>从灵感到分镜，再到真正运行的代码动画。当前版本提供可编辑分镜与真实 Canvas 动画预览；AI API 和 MP4 渲染尚未接通。</p><div class="quicklinks"><span>✧ 一句话创作</span><span>▧ 模板创作</span><span>◈ 进阶创作</span></div><main><section class="panel" id="create"><h2>创作控制台</h2><label for="prompt">你的创意</label><textarea id="prompt">如果世界可以用一句话创造？让一座未来城市从星光中生长。</textarea><label for="format">画幅</label><select id="format"><option value="portrait">竖屏 9:16</option><option value="landscape">横屏 16:9</option></select><div class="buttons"><button id="create">生成本地分镜</button><button class="secondary" id="save">保存项目</button></div><p id="status" role="status"></p><h3>分镜时间轴</h3><ol id="shots"></ol><div class="buttons"><button class="secondary" id="export">导出项目 JSON</button><button class="secondary" id="handoff">导出 Agent 交接单</button></div></section><section class="panel" id="scene"><h2>真实动画预览</h2><div class="preview"><canvas id="scene" width="540" height="720" aria-label="代码生成的动态粒子城市预览"></canvas></div><div class="buttons"><button id="play">播放 / 重播</button></div><p>浏览器实时绘制粒子与建筑。此预览不是 AI 视频，也不代表 MP4 已生成。</p></section></main></div><script type="module" src="./studio.js"></script></body></html>
