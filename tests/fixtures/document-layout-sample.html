<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Layout QA Fixture</title>
<style>
  body { font: 14px/1.45 Arial, sans-serif; margin: 24px; color: #20313d; }
  .table-wrap { max-width: 100%; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { padding: 10px 12px; border: 1px solid #d8dfe3; overflow-wrap: anywhere; vertical-align: top; }
  th { background: #385365; color: white; text-align: left; }
  th:nth-child(2) { text-align: right; }
  td:first-child { text-align: left; width: 32%; }
  td:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; width: 22%; }
  td:nth-child(3) { text-align: left; }
  tbody tr:nth-child(even) { background: #f5f3ef; }
  @media (max-width: 520px) { body { margin: 12px; } th, td { padding: 8px; } }
</style>
</head>
<body>
<h1>Project cost summary</h1>
<div class="table-wrap">
<table>
<thead><tr><th>Item</th><th>Amount (EUR)</th><th>Explanation</th></tr></thead>
<tbody>
<tr><td>ROLLOUT</td><td>€437,350.00</td><td>Production €300,900 + services €136,450</td></tr>
<tr><td>PROPS</td><td>€51,940.00</td><td>50 sets aligned with rollout</td></tr>
<tr><td>PROTOTYPE</td><td>€5,279.00</td><td>Sample production cost</td></tr>
<tr><td><strong>Total investment</strong></td><td><strong>€494,569.00</strong></td><td>50 complete sets</td></tr>
</tbody>
</table>
</div>
</body>
</html>
